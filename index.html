<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>F.Learning — Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══ SIDEBAR ═══ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <span class="logo-mark">F.</span>
      <span class="logo-text">Admin</span>
    </div>

    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" data-view="overview">
        <i class="ti ti-layout-dashboard"></i>
        <span>Overview</span>
      </a>
      <div class="nav-section-label">Tools</div>
      <!-- JS sẽ inject tool nav items ở đây -->
      <div id="nav-tools"></div>
    </nav>

    <div class="sidebar-footer">
      <span id="last-updated-sidebar" class="footer-note"></span>
    </div>
  </aside>

  <!-- ═══ MAIN ═══ -->
  <main class="main-content">

    <!-- TOPBAR -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" id="menu-toggle" aria-label="Toggle sidebar">
          <i class="ti ti-menu-2"></i>
        </button>
        <div>
          <h1 class="page-title" id="page-title">Overview</h1>
          <p class="page-subtitle" id="page-subtitle">Tất cả tools — <span id="today-display"></span></p>
        </div>
      </div>
      <div class="topbar-right">
        <button class="btn-refresh" id="btn-refresh" title="Refresh data">
          <i class="ti ti-refresh"></i>
        </button>
        <span class="badge-live"><i class="ti ti-circle-filled"></i> Live</span>
      </div>
    </header>

    <!-- VIEWS -->
    <div class="view-container">

      <!-- Overview view -->
      <div id="view-overview" class="view active">
        <div class="overview-stats" id="overview-stats">
          <!-- JS render stat cards -->
        </div>
        <div class="tools-grid" id="tools-grid">
          <!-- JS render tool cards -->
        </div>
      </div>

      <!-- Detail view (per-tool) -->
      <div id="view-detail" class="view">
        <div id="detail-content">
          <!-- JS render tool detail -->
        </div>
      </div>

    </div>
  </main>

  <script src="tools/daily-update/config.js"></script>
  <script src="tools/bd-mkt-daily/config.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
