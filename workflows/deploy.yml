name: Deploy Dashboard

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject API key
        run: |
          sed -i 's/%%OPENAI_KEY%%/${{ secrets.OPENAI_API_KEY }}/g' tools/candidate-scoring/config.js
          sed -i 's/%%OPENAI_KEY%%/${{ secrets.OPENAI_API_KEY }}/g' tools/daily-update/config.js
          sed -i 's/%%OPENAI_KEY%%/${{ secrets.OPENAI_API_KEY }}/g' tools/bd-mkt-daily/config.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
